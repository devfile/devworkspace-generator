codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

# Ignore files/directories that tests won't cover
ignore:
  - "tests/**"           # Test files
  - "**/*.test.ts"       # Test files
  - "**/*.spec.ts"       # Test files
  - "lib/**"             # Compiled output
  - "coverage/**"        # Coverage reports
  - "node_modules/**"    # Dependencies

# Carry forward coverage from previous successful uploads when a flag's
# report is missing (e.g. a CI test suite failed and skipped uploading).
# This prevents patch coverage from dropping drastically due to incomplete data.
flag_management:
  default_rules:
    carryforward: true

flags:
  unit-tests:
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
